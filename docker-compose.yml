services:
  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    # Added --host 0.0.0.0 and --disable-host-check
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
volumes:
  node_modules:

networks:
  default:
    driver: bridge