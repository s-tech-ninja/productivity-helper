services:
  node:
    dns:
      - 8.8.8.8
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:cached
      - docs:/app/docs
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    # Added --host 0.0.0.0 and --disable-host-check
    command: >
      sh -c "
        npm set fetch-timeout 60000 &&
        npm set fetch-retries 2 &&
        npm install --legacy-peer-deps &&
        npm run build:prod &&
        cp -r dist/ docs/
      "

volumes:
  node_modules:
  docs:

networks:
  default:
    driver: bridge