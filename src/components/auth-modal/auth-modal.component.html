<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div 
    class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity duration-300"
    (click)="close.emit()">
  </div>
  
  <!-- Modal -->
  <div class="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl transform transition-all duration-300 scale-100 overflow-hidden border border-slate-100 dark:border-slate-800">
    <!-- Decoration -->
    <div class="h-2 bg-gradient-to-r from-indigo-500 to-purple-500"></div>
    
    <div class="p-8">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-indigo-50 dark:bg-indigo-900/30 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
          <app-icon name="user" class="text-indigo-600 dark:text-indigo-400" [size]="32"></app-icon>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Welcome Back</h2>
        <p class="text-slate-500 dark:text-slate-400 mt-2">Sign in to sync your productivity flow</p>
      </div>

      <button 
        class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-750 text-slate-700 dark:text-slate-200 font-medium py-3.5 px-4 rounded-xl transition-all mb-6 group relative overflow-hidden shadow-sm hover:shadow"
      >
         <app-icon name="google" class="text-slate-600 dark:text-slate-400 group-hover:scale-110 transition-transform"></app-icon>
         <span>Continue with Google</span>
      </button>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400">Or continue with email</span>
        </div>
      </div>

      <form class="space-y-4" (submit)="$event.preventDefault()">
        <div class="space-y-1">
          <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest ml-1">Email</label>
          <div class="relative group">
            <app-icon name="mail" [size]="18" class="absolute left-[0.3rem] top-1/2 -translate-y-1/2 text-slate-400 group-hover:text-indigo-500 transition-colors pointer-events-none"></app-icon>
            <input type="email" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 transition-all duration-200 ease-in-out hover:bg-white dark:hover:bg-slate-800 hover:border-slate-300 dark:hover:border-slate-600 focus:bg-white dark:focus:bg-slate-900 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 focus:outline-none pl-10" placeholder="you@example.com">
          </div>
        </div>
        <div class="space-y-1">
           <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest ml-1">Password</label>
           <div class="relative group">
             <app-icon name="lock" [size]="18" class="absolute left-[0.3rem] top-1/2 -translate-y-1/2 text-slate-400 group-hover:text-indigo-500 transition-colors pointer-events-none"></app-icon>
             <input type="password" class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 transition-all duration-200 ease-in-out hover:bg-white dark:hover:bg-slate-800 hover:border-slate-300 dark:hover:border-slate-600 focus:bg-white dark:focus:bg-slate-900 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 focus:outline-none pl-10" placeholder="••••••••">
           </div>
        </div>
        <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-500/30 transition-all active:scale-95 mt-2">
          Sign In
        </button>
      </form>
      
      <div class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
        Don't have an account? <a href="#" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline">Sign up</a>
      </div>
    </div>

    <button 
      (click)="close.emit()"
      class="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors"
    >
      <app-icon name="x" [size]="20"></app-icon>
    </button>
  </div>
</div>
