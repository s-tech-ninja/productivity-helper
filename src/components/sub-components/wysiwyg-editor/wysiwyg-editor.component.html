<div class="space-y-2">
  @if (label) {
    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest ml-1">{{ label }}</label>
  }
  
  <div 
    class="bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden transition-all duration-200 ease-in-out focus-within:border-indigo-500 focus-within:ring-4 focus-within:ring-indigo-500/10"
    [class.opacity-75]="readonly"
  >
    <!-- Tabs -->
    <div class="flex items-center justify-between p-2 bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
      <div class="flex gap-1">
        <button type="button" (click)="switchMode('edit')" [disabled]="readonly" class="px-3 py-1 text-sm font-medium rounded-lg disabled:opacity-50 transition-colors" [class.bg-white]="mode() === 'edit'" [class.dark:bg-slate-700]="mode() === 'edit'" [class.text-slate-900]="mode() === 'edit'" [class.dark:text-white]="mode() === 'edit'" [class.text-slate-500]="mode() !== 'edit'" [class.dark:text-slate-400]="mode() !== 'edit'">
          Write
        </button>
        <button type="button" (click)="switchMode('preview')" class="px-3 py-1 text-sm font-medium rounded-lg transition-colors" [class.bg-white]="mode() === 'preview'" [class.dark:bg-slate-700]="mode() === 'preview'" [class.text-slate-900]="mode() === 'preview'" [class.dark:text-white]="mode() === 'preview'" [class.text-slate-500]="mode() !== 'preview'" [class.dark:text-slate-400]="mode() !== 'preview'">
          Preview
        </button>
      </div>

      <!-- Formatting Toolbar (Visible in Preview/Editor Mode) -->
      @if (!readonly) {
        <div class="flex flex-wrap items-center gap-1">
          <!-- Text Styles -->
          <select (change)="handleCommand('formatBlock', $any($event.target).value)" class="h-7 text-xs bg-transparent border border-slate-200 dark:border-slate-700 rounded px-1 text-slate-600 dark:text-slate-300 focus:outline-none cursor-pointer">
            <option value="P">Paragraph</option>
            <option value="H1">Heading 1</option>
            <option value="H2">Heading 2</option>
            <option value="H3">Heading 3</option>
            <option value="H4">Heading 4</option>
            <option value="H5">Heading 5</option>
            <option value="H6">Heading 6</option>
            <option value="BLOCKQUOTE">Quote</option>
            <option value="PRE">Code Block</option>
          </select>

          <div class="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1"></div>

          <!-- Character Styles -->
          <button type="button" (mousedown)="$event.preventDefault()" (click)="handleCommand('bold')" class="p-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Bold (Ctrl+B)"><app-icon name="bold" [size]="14"></app-icon></button>
          <button type="button" (mousedown)="$event.preventDefault()" (click)="handleCommand('italic')" class="p-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Italic (Ctrl+I)"><app-icon name="italic" [size]="14"></app-icon></button>
          <button type="button" (mousedown)="$event.preventDefault()" (click)="handleCommand('underline')" class="p-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Underline (Ctrl+U)"><app-icon name="underline" [size]="14"></app-icon></button>
          <button type="button" (mousedown)="$event.preventDefault()" (click)="handleCommand('strikeThrough')" class="p-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Strikethrough"><app-icon name="strikethrough" [size]="14"></app-icon></button>
          
          <div class="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1"></div>

          <!-- Colors -->
          <div class="relative flex items-center justify-center w-6 h-6 overflow-hidden rounded hover:bg-slate-200 dark:hover:bg-slate-700 cursor-pointer" title="Text Color">
             <span class="font-bold text-xs text-slate-600 dark:text-slate-300">A</span>
             <input type="color" (input)="handleCommand('foreColor', $any($event.target).value)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
             <div class="absolute bottom-0.5 left-1 right-1 h-0.5 bg-indigo-500"></div>
          </div>

          <div class="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1"></div>

          <!-- Alignment -->
          <button type="button" (mousedown)="$event.preventDefault()" (click)="handleCommand('justifyLeft')" class="p-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Align Left"><app-icon name="align-left" [size]="14"></app-icon></button>
          <button type="button" (mousedown)="$event.preventDefault()" (click)="handleCommand('justifyCenter')" class="p-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Align Center"><app-icon name="align-center" [size]="14"></app-icon></button>
          <button type="button" (mousedown)="$event.preventDefault()" (click)="handleCommand('justifyRight')" class="p-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Align Right"><app-icon name="align-right" [size]="14"></app-icon></button>

          <div class="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1"></div>

          <!-- Lists -->
          <button type="button" (mousedown)="$event.preventDefault()" (click)="handleCommand('list')" class="p-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Bullet List"><app-icon name="list" [size]="14"></app-icon></button>
          <button type="button" (mousedown)="$event.preventDefault()" (click)="handleCommand('orderedList')" class="p-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Ordered List"><app-icon name="list-ordered" [size]="14"></app-icon></button>
          
          <div class="w-px h-4 bg-slate-300 dark:bg-slate-600 mx-1"></div>
          
          <button type="button" (mousedown)="$event.preventDefault()" (click)="handleCommand('link')" class="p-1 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Link (Ctrl+K)"><app-icon name="link" [size]="14"></app-icon></button>
        </div>
      }
    </div>

    <!-- Editor/Preview Area -->
    @if (mode() === 'edit') {
      <textarea
        #textarea
        [value]="valueSignal()"
        (input)="onInput($event)"
        (keydown)="onKeyDown($event)"
        (blur)="onTouched()"
        [attr.disabled]="readonly ? true : null"
        class="editor-content w-full block px-5 py-4 text-sm bg-transparent text-slate-700 dark:text-slate-300 focus:outline-none leading-relaxed resize-y"
        [style.min-height]="minHeight"
        placeholder="Use Markdown for formatting (e.g., **bold**, # heading)..."
      ></textarea>
    } @else {
      <div 
        #editorDiv
        [attr.contenteditable]="!readonly"
        (input)="onInput($event)"
        (focus)="onPreviewFocus()"
        (blur)="onPreviewBlur()"
        class="editor-content w-full px-5 py-4 text-sm text-slate-700 dark:text-slate-300 leading-relaxed prose dark:prose-invert max-w-none"
        [style.min-height]="minHeight"
        [innerHTML]="previewHtml()"
      ></div>
    }
  </div>
  
  <!-- Layout Section (Placeholder) -->
  @if (!readonly) {
    <div class="px-2">
      <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Layout <span class="font-normal normal-case opacity-50">(Coming Soon)</span></h4>
    </div>
  }
</div>
