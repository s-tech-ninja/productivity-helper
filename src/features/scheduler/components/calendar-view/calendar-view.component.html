<div class="p-4 md:p-8 h-full flex flex-col">
  <!-- Calendar Header -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-4">
      <h2 class="text-2xl font-bold text-slate-900 dark:text-white">
        {{ currentDate() | date:'MMMM y' }}
      </h2>
      <div class="flex items-center gap-1">
        <button (click)="previousMonth()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-slate-500 dark:text-slate-400">
          <app-icon name="chevron-right" [size]="20" class="rotate-180"></app-icon>
        </button>
        <button (click)="goToToday()" class="px-3 py-1.5 text-sm font-medium rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-slate-600 dark:text-slate-300">
          Today
        </button>
        <button (click)="nextMonth()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-slate-500 dark:text-slate-400">
          <app-icon name="chevron-right" [size]="20"></app-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Calendar Grid -->
  <div class="flex-1 grid grid-cols-7 gap-px bg-slate-200 dark:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden">
    <!-- Day Headers -->
    @for (day of daysOfWeek; track day) {
      <div class="py-3 text-center font-semibold text-sm text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-800">
        {{ day }}
      </div>
    }

    <!-- Calendar Days -->
    @for (day of daysInMonth(); track day.date.toISOString()) {
      <div 
        class="p-2 flex flex-col bg-white dark:bg-slate-800/50 transition-colors hover:bg-slate-50 dark:hover:bg-slate-800 min-h-[100px] lg:min-h-[120px]"
        [class.opacity-50]="!day.isCurrentMonth"
      >
        <div 
          class="text-sm font-semibold mb-2"
          [class.text-indigo-600]="day.isToday"
          [class.dark:text-indigo-400]="day.isToday"
          [class.w-7]="day.isToday"
          [class.h-7]="day.isToday"
          [class.rounded-full]="day.isToday"
          [class.bg-indigo-50]="day.isToday"
          [class.dark:bg-indigo-900/30]="day.isToday"
          [class.flex]="day.isToday"
          [class.items-center]="day.isToday"
          [class.justify-center]="day.isToday"
        >
          {{ day.date | date:'d' }}
        </div>
        <div class="space-y-1.5 overflow-y-auto custom-scrollbar -mr-1 pr-1">
          @for (task of day.tasks; track task.id) {
            <div 
              (click)="openTaskDetail(task)"
              class="px-2 py-1.5 rounded-lg text-xs font-medium cursor-pointer transition-all hover:ring-2 hover:ring-indigo-500/50"
              [ngClass]="{
                'bg-rose-100 text-rose-800 dark:bg-rose-900/30 dark:text-rose-200': task.category === 'Super Important',
                'bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-200': task.category === 'Important',
                'bg-slate-100 text-slate-800 dark:bg-slate-700 dark:text-slate-200': task.category === 'Less Important'
              }"
            >
              <p class="truncate">{{ task.title }}</p>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
