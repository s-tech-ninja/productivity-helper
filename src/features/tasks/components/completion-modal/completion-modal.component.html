<div class="fixed inset-0 z-[60] flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div 
    class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"
    (click)="cancel.emit()"
  ></div>

  <!-- Modal -->
  <div class="relative w-full max-w-lg bg-white dark:bg-slate-800 rounded-3xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200 border border-slate-100 dark:border-slate-700">
    
    <!-- Header -->
    <div class="bg-emerald-600 p-8 text-white text-center relative overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-emerald-500 to-teal-600 opacity-50"></div>
      <div class="relative z-10">
        <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-sm shadow-inner">
          <app-icon name="check" [size]="40" class="text-white drop-shadow-sm"></app-icon>
        </div>
        <h2 class="text-2xl font-bold tracking-tight">Task Completed!</h2>
        <p class="text-emerald-50 mt-2 font-medium truncate max-w-sm mx-auto opacity-90">{{ task().title }}</p>
      </div>
    </div>

    <div class="p-8 space-y-8">
      
      <!-- Focus Score -->
      <div class="text-center">
        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-4 uppercase tracking-widest">How was your focus?</label>
        <div class="flex items-center justify-center gap-3">
          @for (star of [1, 2, 3, 4, 5]; track star) {
            <button 
              (click)="focusScore.set(star)"
              class="p-2 transition-all hover:scale-110 focus:outline-none group relative"
            >
              <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="36" height="36" 
                viewBox="0 0 24 24" 
                fill="currentColor" 
                stroke="currentColor" 
                stroke-width="2" 
                stroke-linecap="round" 
                stroke-linejoin="round" 
                class="stroke-none transition-colors duration-300"
                [class.text-amber-400]="star <= focusScore()"
                [class.text-slate-200]="star > focusScore()"
                [class.dark:text-slate-700]="star > focusScore()"
                [class.drop-shadow-sm]="star <= focusScore()"
              >
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </button>
          }
        </div>
        <p class="text-sm font-medium text-emerald-600 dark:text-emerald-400 mt-2">Score: {{ focusScore() }}/5</p>
      </div>

      <!-- Reflection -->
      <div>
        <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-widest ml-1">Reflection / Notes</label>
        <textarea 
          [(ngModel)]="reflection" 
          rows="3" 
          class="w-full px-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 transition-all duration-200 ease-in-out hover:bg-white dark:hover:bg-slate-800 hover:border-slate-300 dark:hover:border-slate-600 focus:bg-white dark:focus:bg-slate-900 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 focus:outline-none resize-none"
          placeholder="What went well? Any distractions?"
        ></textarea>
      </div>

    </div>

    <!-- Footer -->
    <div class="p-6 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
      <button 
        (click)="cancel.emit()"
        class="px-6 py-3 text-slate-600 dark:text-slate-300 font-bold hover:bg-white dark:hover:bg-slate-800 rounded-xl transition-colors"
      >
        Cancel
      </button>
      <button 
        (click)="onSubmit()"
        class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition-all active:scale-95 flex items-center gap-2"
      >
        <span>Save & Complete</span>
        <app-icon name="chevron-right" [size]="16"></app-icon>
      </button>
    </div>

  </div>
</div>
